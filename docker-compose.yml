services:
  backend:
    build: ./vm-backend
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    env_file:
      - ./vm-backend/.env
    environment:
      PORT: "8080"
      DB_HOST: host.docker.internal
      DB_PORT: "${DB_PORT:-5432}"
      DB_USER: "${DB_USER:-venturematedb}"
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_NAME: "${DB_NAME:-venturematedb}"
      DB_SSLMODE: disable
      DATABASE_URL: "postgres://${DB_USER}:${DB_PASSWORD}@host.docker.internal:${DB_PORT}/${DB_NAME}?sslmode=disable"
      SMTP_HOST: "${SMTP_HOST}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER}"
      SMTP_PASSWORD: "${SMTP_PASSWORD}"
      SMTP_FROM_NAME: "${SMTP_FROM_NAME:-VentureMate}"
      SMTP_FROM_EMAIL: "${SMTP_FROM_EMAIL:-noreply@venturemate.net}"
      EMAIL_LOGO_URL: "${EMAIL_LOGO_URL:-https://venturemate.net/logo.png}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - vm-network

  frontend:
    build:
      context: ./vm-frontend
      args:
        VITE_GRAPHQL_URL: /graphql
        VITE_AUTH_SERVER_URL: /auth
        VITE_GOOGLE_AUTH_URL: /auth/google
        VITE_CALLBACK_URL: http://localhost:3000/vm/auth/callback
        VITE_PUBLIC_SITE_BASE_DOMAIN: ${VITE_PUBLIC_SITE_BASE_DOMAIN:-venturemate.net}
        VITE_PUBLIC_SITE_CNAME_TARGET: ${VITE_PUBLIC_SITE_CNAME_TARGET:-sites.venturemate.net}
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend
    networks:
      - vm-network

networks:
  vm-network: