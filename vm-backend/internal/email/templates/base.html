<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f1f5f9;
        }
        .container {
            max-width: 620px;
            margin: 30px auto;
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 10px 10px -5px rgb(0 0 0 / 0.04);
        }
        .header {
            background-color: #0f172a;
            padding: 28px 32px;
            text-align: center;
            color: #ffffff;
        }
        .header img {
            max-height: 110px;
            margin-bottom: 8px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
        .header h1 {
            margin: 0;
            font-size: 26px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }
        .body {
            padding: 32px 36px;
            color: #334155;
            font-size: 15px;
            line-height: 1.65;
        }
        .body h2 {
            color: #0f172a;
            margin: 0 0 16px 0;
            font-size: 20px;
            font-weight: 600;
        }
        .footer {
            background-color: #f8fafc;
            padding: 20px 36px;
            text-align: center;
            font-size: 12.5px;
            color: #64748b;
            border-top: 1px solid #e2e8f0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="{{.Logo}}" alt="VentureMate Logo">
        </div>
        <div class="body">
            {{.Body}}
        </div>
        <div class="footer">
            <p>© {{.Year}} VentureMate. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
