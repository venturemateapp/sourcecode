services:
  backend:
    environment:
      DB_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: venturematedb
      POSTGRES_PASSWORD: venturematedb
      POSTGRES_DB: venturematedb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U venturematedb"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vm-network

volumes:
  pgdata:

networks:
  vm-network:
