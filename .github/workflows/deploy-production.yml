name: Deploy Production

on:
  push:
    branches: [Production]

concurrency:
  group: production
  cancel-in-progress: true

env:
  APP_DIR: /data/vm/sourcecode

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}
          envs: >
            APP_DIR,
            GIT_PAT,
            PORT,DB_HOST,DB_PORT,DB_USER,DB_PASSWORD,DB_NAME,DB_SSLMODE,
            JWT_SECRET,OAUTH_REDIRECT_BASE,FRONTEND_URL,
            SMTP_HOST,SMTP_PORT,SMTP_USER,SMTP_PASSWORD,
            S3_BUCKET,S3_REGION,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,
            GEMINI_API_KEY,CLAUDE_API_KEY,GROK_API_KEY,OPENAI_API_KEY,
            OPENROUTER_API_KEY,OPENROUTER_ENDPOINT,OPENROUTER_MODEL,
            AI_PROVIDER,AI_ALLOW_PROVIDER_OVERRIDE,AI_FALLBACK_PROVIDERS,
            EMAIL_FROM_NAME,EMAIL_LOGO_URL,
            PUBLIC_SITE_BASE_DOMAIN,PUBLIC_SITE_CNAME_TARGET,
            VITE_GRAPHQL_URL,VITE_AUTH_SERVER_URL,VITE_GOOGLE_AUTH_URL,VITE_CALLBACK_URL
          script: |
            cd "$APP_DIR"

            git remote set-url origin https://$GIT_PAT@github.com/venturemateapp/sourcecode.git
            git fetch origin
            git reset --hard origin/Production

            cat > vm-backend/.env << ENVEOF
            PORT=$PORT
            DB_HOST=$DB_HOST
            DB_PORT=$DB_PORT
            DB_USER=$DB_USER
            DB_PASSWORD=$DB_PASSWORD
            DB_NAME=$DB_NAME
            DB_SSLMODE=$DB_SSLMODE
            JWT_SECRET=$JWT_SECRET
            OAUTH_REDIRECT_BASE=$OAUTH_REDIRECT_BASE
            FRONTEND_URL=$FRONTEND_URL
            SMTP_HOST=$SMTP_HOST
            SMTP_PORT=$SMTP_PORT
            SMTP_USER=$SMTP_USER
            SMTP_PASSWORD=$SMTP_PASSWORD
            S3_BUCKET=$S3_BUCKET
            S3_REGION=$S3_REGION
            AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID
            AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY
            GEMINI_API_KEY=$GEMINI_API_KEY
            CLAUDE_API_KEY=$CLAUDE_API_KEY
            GROK_API_KEY=$GROK_API_KEY
            OPENAI_API_KEY=$OPENAI_API_KEY
            OPENROUTER_API_KEY=$OPENROUTER_API_KEY
            OPENROUTER_ENDPOINT=$OPENROUTER_ENDPOINT
            OPENROUTER_MODEL=$OPENROUTER_MODEL
            AI_PROVIDER=$AI_PROVIDER
            AI_ALLOW_PROVIDER_OVERRIDE=$AI_ALLOW_PROVIDER_OVERRIDE
            AI_FALLBACK_PROVIDERS=$AI_FALLBACK_PROVIDERS
            EMAIL_FROM_NAME=$EMAIL_FROM_NAME
            EMAIL_LOGO_URL=$EMAIL_LOGO_URL
            PUBLIC_SITE_BASE_DOMAIN=$PUBLIC_SITE_BASE_DOMAIN
            PUBLIC_SITE_CNAME_TARGET=$PUBLIC_SITE_CNAME_TARGET
            ENVEOF

            cat > vm-frontend/.env << ENVEOF
            VITE_GRAPHQL_URL=$VITE_GRAPHQL_URL
            VITE_AUTH_SERVER_URL=$VITE_AUTH_SERVER_URL
            VITE_GOOGLE_AUTH_URL=$VITE_GOOGLE_AUTH_URL
            VITE_CALLBACK_URL=$VITE_CALLBACK_URL
            ENVEOF

            docker compose up --build -d
            docker system prune -af
